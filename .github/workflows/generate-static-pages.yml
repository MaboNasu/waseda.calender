name: 静的ページの自動生成

# データまたは静的ページに影響する共通UI/生成スクリプトがmainへ入った時と、
# JSTの日付が変わった直後に sitemap.xml と個別ページ(event/*.html, org/*.html)を再生成する。
# 日付依存の「終了しました」表示も、無関係なPRまで翌日に差分が出る状態を避けて毎日同期する。

on:
  push:
    branches: [main]
    paths:
      - 'events.js'
      - 'organizations.js'
      - 'style.css'
      - 'script.js'
      - 'event-page.js'
      - 'organizations-page.js'
      - 'image-generator.js'
      - 'auth-ui.js'
      - 'scripts/generate-event-pages.js'
      - 'scripts/generate-org-pages.js'
  # 「終了しました」など日付依存の静的表示をJSTの日付変更後に同期する。
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: sitemap.xmlを再生成
        run: node scripts/generate-sitemap.js

      - name: イベント個別ページを再生成
        run: node scripts/generate-event-pages.js

      - name: 団体個別ページを再生成
        run: node scripts/generate-org-pages.js

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml event/ org/
          git diff --cached --quiet || git commit -m "chore: 静的ページ(sitemap.xml / event/*.html / org/*.html)を自動再生成 [skip ci]"
          git push
