name: 情報源の変更チェック

# events.js に登録しているイベント情報の一次情報源（scripts/sources.json）を毎晩取得し、
# 前回チェック時からの変更を機械的に検知する。中身の意味は判断しない（無料・API課金なし）。
# 変更が見つかったらIssueを作成/更新するだけで、events.jsは自動更新しない。
#
# 実際の反映（本文の詳細分析・events.js更新）は、運営者が朝このIssueを見て、
# ローカルのClaude Code側で行う（費用が発生する外部AI APIの直接呼び出しは行わない方針のため）。

on:
  schedule:
    # 毎日 03:00 JST = 18:00 UTC(前日)
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ソースの変更チェックを実行
        id: check
        run: node scripts/check-sources.js

      - name: 結果を読み取る
        id: result
        run: |
          HAS_CHANGES=$(node -e "console.log(require('./scripts/last-check-result.json').hasChanges)")
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

      - name: sources.json の更新をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sources.json
          git diff --cached --quiet || git commit -m "chore: sources.jsonのチェック結果を更新 [skip ci]"
          git push

      - name: 既存のIssueを検索
        if: steps.result.outputs.has_changes == 'true'
        id: find_issue
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'source-watch'
            });
            return issues.data.length > 0 ? issues.data[0].number : null;
          result-encoding: string

      - name: 変更内容を読み込む
        if: steps.result.outputs.has_changes == 'true'
        id: summary
        run: |
          {
            echo 'body<<EOF'
            cat scripts/last-check-summary.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 新規Issueを作成
        if: steps.result.outputs.has_changes == 'true' && steps.find_issue.outputs.result == 'null'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '情報源に変更を検知しました',
              body: `${{ steps.summary.outputs.body }}`,
              labels: ['source-watch']
            });

      - name: 既存Issueにコメント追加
        if: steps.result.outputs.has_changes == 'true' && steps.find_issue.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.find_issue.outputs.result }},
              body: `${{ steps.summary.outputs.body }}`
            });
