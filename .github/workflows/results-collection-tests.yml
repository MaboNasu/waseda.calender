name: Results collection helpers

on:
  pull_request:
    paths:
      - 'scripts/results-collection-queue.js'
      - 'scripts/check-result-drafts.js'
      - 'scripts/test-results-collection.js'
      - '.github/workflows/results-collection-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test results collection (offline)
        run: node --test scripts/test-results-collection.js
      - name: Sample queue read (no publish)
        run: node scripts/results-collection-queue.js --as-of 2026-11-14 --limit 2 --format json > /dev/null
