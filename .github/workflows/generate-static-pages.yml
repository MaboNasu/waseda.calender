name: 静的ページの自動生成

# events.js / organizations.js が main に push されたら、sitemap.xml と個別ページ
# (event/*.html, org/*.html)を自動で再生成してコミットする。どれも scripts/generate-*.js が
# 生成する派生ファイルであり、手動での再生成を忘れるとSEO面での更新が漏れるため自動化している。

on:
  push:
    branches: [main]
    paths:
      - 'events.js'
      - 'organizations.js'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: sitemap.xmlを再生成
        run: node scripts/generate-sitemap.js

      - name: イベント個別ページを再生成
        run: node scripts/generate-event-pages.js

      - name: 団体個別ページを再生成
        run: node scripts/generate-org-pages.js

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml event/ org/
          git diff --cached --quiet || git commit -m "chore: 静的ページ(sitemap.xml / event/*.html / org/*.html)を自動再生成 [skip ci]"
          git push
